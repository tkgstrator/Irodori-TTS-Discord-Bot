name: Code Check

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master

permissions:
  contents: read
  packages: read

jobs:
  check:
    name: Code Check
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/irodori_test
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: irodori_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d irodori_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Prisma client (workers/web)
        run: workers/web/node_modules/.bin/prisma generate --schema=workers/web/prisma/schema.prisma --generator=client

      - name: Apply database migrations (workers/web)
        working-directory: workers/web
        run: node_modules/.bin/prisma migrate deploy

      - name: Biome (packages/)
        run: bun run lint

      - name: Biome (workers/)
        run: bunx biome check workers/

      - name: Typecheck packages/shared
        working-directory: packages/shared
        run: bunx tsc --noEmit

      - name: Typecheck workers/bot
        working-directory: workers/bot
        run: bunx tsc --noEmit

      - name: Typecheck workers/web
        working-directory: workers/web
        run: bunx tsc --noEmit

      - name: Test
        run: bun test
