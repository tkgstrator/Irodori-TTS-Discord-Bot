name: Code Check

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  check:
    name: Code Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome (packages/)
        run: bun run lint

      - name: Biome (workers/)
        run: bunx biome check workers/

      - name: Typecheck packages/shared
        working-directory: packages/shared
        run: bunx tsc --noEmit

      - name: Typecheck workers/bot
        working-directory: workers/bot
        run: bunx tsc --noEmit

      - name: Typecheck workers/web
        working-directory: workers/web
        run: bunx tsc --noEmit

      - name: Test workers/bot
        working-directory: workers/bot
        run: bun test
