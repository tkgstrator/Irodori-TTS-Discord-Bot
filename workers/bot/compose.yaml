services:
  app:
    image: tkgling/irodori-tts-discord-bot:latest
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
    depends_on:
      redis:
        condition: service_healthy
      irodori-tts:
        condition: service_healthy
    stdin_open: true
    tty: true

  dashboard:
    image: tkgling/irodori-tts-dashboard:latest
    environment:
      REDIS_URL: redis://redis:6379
      IRODORI_TTS_BASE_URL: http://irodori-tts:8765
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI}
      DEFAULT_SPEAKER_ID: ${DEFAULT_SPEAKER_ID}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      PORT: 18575
    ports:
      - 18575:18575
    depends_on:
      redis:
        condition: service_healthy

  irodori-tts:
    image: tkgling/irodori-tts:latest
    volumes:
      - ./configs/config.yaml:/app/config.yaml:ro
      - ./models:/app/models:ro
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8765/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s

  redis:
    image: redis:8.4.0
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
    name: redis_data
  hf_cache:
    driver: local
