services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../../:/home/vscode/app:cached
      - node_modules:/home/vscode/app/node_modules:cached
    env_file:
      - ../../.env
    depends_on:
      redis:
        condition: service_healthy
      irodori-tts:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      NODE_OPTIONS: --no-deprecation
      NODE_ENV: development
    stdin_open: true
    tty: true

  # GPU-backed TTS sidecar. `configs/` and `models/` live one level up because
  # they are gitignored host assets shared with the cpu variant's docs.
  irodori-tts:
    image: ghcr.io/tkgstrator/irodori-tts:latest
    volumes:
      - ../configs/config.yaml:/app/config.yaml:ro
      - ../models:/app/models:ro
      - hf_cache:/root/.cache/huggingface
      - venv:/app/.venv
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/health', timeout=5)" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 300s

  postgres:
    image: postgres:17.9
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: irodori-tts
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - 16080:80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8.4.0
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  node_modules:
    driver: local
    name: irodori-tts-discord-bot_devcontainer_node_modules
  pg_data:
    driver: local
    name: irodori-tts-discord-bot_devcontainer_pg_data
  pgadmin_data:
    driver: local
    name: irodori-tts-discord-bot_devcontainer_pgadmin_data
  redis_data:
    driver: local
    name: irodori-tts-discord-bot_devcontainer_redis_data
  hf_cache:
    driver: local
    name: irodori-tts-discord-bot_devcontainer_hf_cache
  venv:
    driver: local
    name: irodori-tts-discord-bot_devcontainer_venv
